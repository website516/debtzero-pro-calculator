<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | DebtZero Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#0a0f1a] text-slate-200">
  <div class="max-w-2xl mx-auto px-6 py-16">
    <h1 class="text-4xl font-semibold mb-8">Contact Us</h1>
    <p class="mb-8 text-slate-300">Have feedback or questions about the calculator? We'd love to hear from you.</p>
    
    <form class="space-y-6">
      <div>
        <label class="block text-sm mb-2">Name</label>
        <input type="text" class="input w-full px-4 py-3 rounded-2xl">
      </div>
      <div>
        <label class="block text-sm mb-2">Email</label>
        <input type="email" class="input w-full px-4 py-3 rounded-2xl">
      </div>
      <div>
        <label class="block text-sm mb-2">Message</label>
        <textarea rows="6" class="input w-full px-4 py-3 rounded-2xl"></textarea>
      </div>
      <button type="submit" class="btn-primary px-8 py-3 rounded-2xl font-semibold">Send Message</button>
    </form>
  </div>
</body>
</html>
