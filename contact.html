<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | DebtZero Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#0a0f1a] text-slate-200">
<header class="border-b border-white/10 bg-[#0a0f1a]">
<div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center"><span class="text-[#0a0f1a] text-2xl font-bold">DZ</span></div><div><div class="font-semibold text-2xl tracking-tight">DebtZero Pro</div><div class="text-xs text-emerald-400 -mt-1">HONG KONG · 2026</div></div></div>
<div class="flex items-center gap-4"><div class="flex bg-[#111827] rounded-full p-1 text-sm"><button class="lang-btn px-4 py-1.5 rounded-full" data-lang="zh">ZH</button><button class="lang-btn px-4 py-1.5 rounded-full" data-lang="en">EN</button></div><a href="index.html" class="px-6 py-2.5 border border-white/30 hover:bg-white/5 rounded-2xl text-sm font-medium transition" data-zh="返回主頁" data-en="Back to Home"></a></div>
</div>
</header>

<div class="max-w-3xl mx-auto px-6 py-16">
<h1 class="text-4xl font-semibold mb-6" data-zh="聯絡我們" data-en="Contact Us"></h1>
<p class="text-slate-300 mb-8" data-zh="如果你對本工具有任何意見或建議，歡迎與我們聯絡。" data-en="If you have any feedback or suggestions about this tool, we would love to hear from you."></p>

<div class="bg-[#111827] rounded-3xl p-8 border border-white/10">
<form class="space-y-6">
<div>
<label class="block text-sm mb-2" data-zh="姓名" data-en="Name"></label>
<input type="text" class="input w-full px-4 py-3 rounded-2xl">
</div>
<div>
<label class="block text-sm mb-2" data-zh="電子郵件" data-en="Email"></label>
<input type="email" class="input w-full px-4 py-3 rounded-2xl">
</div>
<div>
<label class="block text-sm mb-2" data-zh="留言" data-en="Message"></label>
<textarea rows="6" class="input w-full px-4 py-3 rounded-2xl"></textarea>
</div>
<button type="submit" class="btn-primary px-8 py-3 rounded-2xl font-semibold" data-zh="發送留言" data-en="Send Message"></button>
</form>
</div>
</div>

<footer class="bg-[#0a0f1a] border-t border-white/10 py-10 mt-12">
<div class="max-w-6xl mx-auto px-6 grid md:grid-cols-4 gap-y-8 text-sm">
<div><div class="font-semibold mb-3">DebtZero Pro</div><div class="text-slate-400 text-xs" data-zh="專為香港人設計的債務清零工具" data-en="Debt payoff tool designed for Hong Kong"></div></div>
<div class="space-y-1.5"><a href="index.html" class="block text-slate-400 hover:text-white transition" data-zh="返回主頁" data-en="Back to Home"></a><a href="disclaimer.html" class="block text-slate-400 hover:text-white transition" data-zh="免責聲明" data-en="Disclaimer"></a></div>
<div class="space-y-1.5"><a href="privacy.html" class="block text-slate-400 hover:text-white transition" data-zh="隱私政策" data-en="Privacy Policy"></a><a href="terms.html" class="block text-slate-400 hover:text-white transition" data-zh="服務條款" data-en="Terms of Service"></a></div>
<div class="text-slate-400 text-xs">© 2026 DebtZero Pro</div>
</div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
