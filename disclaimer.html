<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免責聲明 | DebtZero Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#0a0f1a] text-slate-200">
  <header class="border-b border-white/10 bg-[#0a0f1a]">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center">
          <span class="text-[#0a0f1a] text-2xl font-bold">DZ</span>
        </div>
        <div>
          <div class="font-semibold text-2xl tracking-tight">DebtZero Pro</div>
          <div class="text-xs text-emerald-400 -mt-1">HONG KONG · 2026</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex bg-[#111827] rounded-full p-1 text-sm">
          <button onclick="switchLanguage('zh')" class="px-4 py-1.5 rounded-full bg-white text-black font-medium">ZH</button>
          <button onclick="switchLanguage('en')" class="px-4 py-1.5 rounded-full text-white">EN</button>
        </div>
        <a href="index.html" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 rounded-2xl text-sm font-semibold transition">返回主頁</a>
      </div>
    </div>
  </header>
  <div class="max-w-4xl mx-auto px-6 py-16">
    <h1 class="text-5xl font-semibold mb-8" data-zh="免責聲明" data-en="Disclaimer">免責聲明</h1>
    <div class="prose prose-invert max-w-none text-slate-300">
      <p data-zh="DebtZero Pro 提供嘅所有資訊同計算結果只供參考用途，並非專業財務建議。任何決定都應該咨詢合格嘅財務顧問。" data-en="All information and calculation results provided by DebtZero Pro are for reference only and are not professional financial advice. Any decisions should be made after consulting a qualified financial advisor.">DebtZero Pro 提供嘅所有資訊同計算結果只供參考用途，並非專業財務建議。任何決定都應該咨詢合格嘅財務顧問。</p>
      <p data-zh="我哋唔對任何因使用本網站而產生嘅損失或損害負責。利率、還款計劃等資料可能隨時間變化，請以最新官方資料為準。" data-en="We are not liable for any loss or damage arising from the use of this website. Interest rates and repayment plans may change over time. Please refer to the latest official information.">我哋唔對任何因使用本網站而產生嘅損失或損害負責。利率、還款計劃等資料可能隨時間變化，請以最新官方資料為準。</p>
      <p class="text-sm text-slate-400 mt-12">最後更新：2026 年 5 月</p>
    </div>
  </div>
  <footer class="border-t border-white/10 bg-[#0a0f1a] py-8">
    <div class="max-w-6xl mx-auto px-6 text-sm text-slate-400 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>DebtZero Pro — 專為香港人設計嘅債務清零工具</div>
      <div class="flex gap-6">
        <a href="about.html" class="hover:text-white">About</a>
        <a href="privacy.html" class="hover:text-white">Privacy</a>
        <a href="terms.html" class="hover:text-white">Terms</a>
        <a href="disclaimer.html" class="hover:text-white">Disclaimer</a>
        <a href="contact.html" class="hover:text-white">Contact</a>
      </div>
      <div>© 2026 DebtZero Pro</div>
    </div>
  </footer>
  <script>
    function switchLanguage(lang) {
      localStorage.setItem('language', lang);
      document.querySelectorAll('[data-zh]').forEach(el => {
        if (lang === 'zh') el.textContent = el.getAttribute('data-zh');
        else el.textContent = el.getAttribute('data-en');
      });
    }
    if (localStorage.getItem('language') === 'en') switchLanguage('en');
  </script>
</body>
</html>
