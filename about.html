<h1 class="text-4xl font-semibold mb-6" data-zh="關於 DebtZero Pro" data-en="About DebtZero Pro"></h1>
<div class="prose prose-invert text-slate-300">
<p data-zh="DebtZero Pro 是為香港人而設計的債務清零工具。我們相信，清理債務不是結束，而是新生活的開始。" data-en="DebtZero Pro is a debt payoff tool designed specifically for people in Hong Kong. We believe clearing debt is not the end, but the beginning of a new financial life."></p>

<h2 class="mt-8 mb-4" data-zh="為什麼我們要做這個工具？" data-en="Why We Built This Tool"></h2>
<p data-zh="在香港，很多人承受著高利息信用卡債務的壓力，卻缺少清晰、可信任的工具來比較不同的還款策略。雪球法與雪崩法是兩種被證明有效的方法，但很少人真正明白它們之間的差別。" data-en="In Hong Kong, many people struggle with high-interest credit card debt but lack clear, trustworthy tools to compare different repayment strategies. The Snowball and Avalanche methods are proven approaches, yet few people truly understand the difference between them."></p>

<p data-zh="我們希望提供一個簡單、透明、具體的工具，讓每個人都能夠明白自己的債務狀況，並作出最適合自己的決策。" data-en="We wanted to create a simple, transparent, and practical tool that helps everyone understand their debt situation and make the best decision for themselves."></p>

<h2 class="mt-8 mb-4" data-zh="我們的信念" data-en="Our Beliefs"></h2>
<p data-zh="債務清零不只係數字遊戲，更係一個重新掌控生活的機會。我們相信，當人們明白自己的選擇會帶來了些什麼後，就能夠更有信心地前行。" data-en="Clearing debt is not just about numbers — it is an opportunity to regain control of your life. We believe that when people truly understand their choices, they can move forward with greater confidence."></p>
