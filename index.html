<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DebtZero Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/main.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#0a0f1a] text-slate-200">
<header class="border-b border-white/10 bg-[#0a0f1a]">
<div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center"><span class="text-[#0a0f1a] text-2xl font-bold">DZ</span></div><div><div class="font-semibold text-2xl tracking-tight">DebtZero Pro</div><div class="text-xs text-emerald-400 -mt-1">HONG KONG · 2026</div></div></div>
<div class="flex items-center gap-4"><div class="flex bg-[#111827] rounded-full p-1 text-sm"><button class="lang-btn px-4 py-1.5 rounded-full" data-lang="zh">ZH</button><button class="lang-btn px-4 py-1.5 rounded-full" data-lang="en">EN</button></div><a href="#tool" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 rounded-2xl text-sm font-semibold transition" data-zh="立即開始計算" data-en="Start Calculation"></a></div>
</div>
</header>

<section class="max-w-5xl mx-auto px-6 pt-14 pb-10"><div class="max-w-3xl"><div class="inline-flex items-center gap-2 px-4 py-1 bg-emerald-900/40 text-emerald-400 text-xs font-medium rounded-full mb-6" data-zh="香港 10,000+ 人正在使用 · 2026 最新" data-en="10,000+ users in Hong Kong · 2026"></div><h1 class="text-6xl font-semibold tracking-tighter leading-none mb-4"><span data-zh="香港最強債務清零計算器" data-en="Hong Kong's Best Debt Payoff Calculator"></span><br><span class="text-emerald-400" data-zh="清零債務" data-en="Get Debt Free"></span></h1><p class="text-2xl text-slate-300 mb-8" data-zh="雪球法 vs 雪崩法 · 即時比較 · 省最多利息" data-en="Snowball vs Avalanche · Compare instantly · Save the most interest"></p><div class="flex items-center gap-4 mb-10"><a href="#tool" class="px-9 py-4 bg-emerald-600 hover:bg-emerald-700 rounded-2xl font-semibold text-lg transition" data-zh="立即開始計算" data-en="Start Calculation"></a><a href="about.html" class="px-8 py-4 border border-white/30 hover:bg-white/5 rounded-2xl font-medium transition" data-zh="了解方法" data-en="Learn More"></a></div></div></section>

<section id="tool" class="max-w-5xl mx-auto px-6 pb-16"><div class="tool-card rounded-3xl p-8 md:p-10"><div class="mb-8"><div class="text-emerald-400 text-sm font-semibold tracking-widest">YOUR DEBTS</div><h2 class="text-3xl font-semibold mt-1" data-zh="輸入債務資料" data-en="Enter Your Debts"></h2></div>
<form id="debt-form"><div id="debt-rows"><div class="debt-row grid grid-cols-12 gap-3 items-end mb-4"><div class="col-span-12 md:col-span-3"><label class="text-xs text-slate-400 block mb-1.5">DEBT NAME</label><input type="text" class="debt-name input w-full px-4 py-2.5 rounded-xl" value="信用卡 A"></div><div class="col-span-6 md:col-span-2"><label class="text-xs text-slate-400 block mb-1.5">BALANCE (HKD)</label><input type="number" class="debt-balance input w-full px-4 py-2.5 rounded-xl" value="45000"></div><div class="col-span-6 md:col-span-2"><label class="text-xs text-slate-400 block mb-1.5">INTEREST RATE (%)</label><input type="number" class="debt-rate input w-full px-4 py-2.5 rounded-xl" value="24"></div><div class="col-span-6 md:col-span-2"><label class="text-xs text-slate-400 block mb-1.5">MIN PAYMENT</label><input type="number" class="debt-min input w-full px-4 py-2.5 rounded-xl" value="900"></div><div class="col-span-6 md:col-span-3 flex items-end"><button type="button" class="remove-debt text-red-400 hover:text-red-500 px-3 py-2 text-sm">移除</button></div></div></div>
<button type="button" id="add-debt" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300 text-sm mb-8"><span class="text-xl leading-none">+</span> <span data-zh="新增債項" data-en="Add Debt"></span></button>
<div class="max-w-md mb-8"><label class="block text-sm text-slate-300 mb-2" data-zh="每月額外還款 (HKD)" data-en="Extra Monthly Payment (HKD)"></label><input type="range" id="extra-payment" min="0" max="15000" step="500" value="3000" class="w-full accent-emerald-500"><div class="text-right text-emerald-400 font-semibold text-2xl mt-1" id="extra-value">HK$3,000</div></div>
<div class="flex flex-col md:flex-row gap-4"><button type="submit" class="btn-primary flex-1 px-8 py-4 rounded-2xl font-semibold text-lg" data-zh="計算還款計劃" data-en="Calculate Payoff Plan"></button><button type="button" id="save-plan" class="px-8 py-4 border border-emerald-600 text-emerald-400 hover:bg-emerald-950 rounded-2xl font-semibold" data-zh="儲存當前計劃" data-en="Save Current Plan"></button></div></form>

<div id="results-section" class="hidden mt-10 pt-10 border-t border-white/10"><h3 class="text-2xl font-semibold mb-6" data-zh="還款結果比較" data-en="Payoff Comparison"></h3><div class="grid md:grid-cols-2 gap-6 mb-8"><div id="snowball-result" class="result-card rounded-3xl p-8"></div><div id="avalanche-result" class="result-card rounded-3xl p-8"></div></div>
<div class="grid md:grid-cols-5 gap-6"><div class="md:col-span-3 tool-card rounded-3xl p-8"><div class="flex justify-between mb-4"><div><div class="font-semibold" data-zh="債務餘額變化曲線" data-en="Debt Balance Over Time"></div><div class="text-sm text-slate-400" data-zh="越低代表還款越快" data-en="Lower = faster payoff"></div></div><button onclick="downloadPDF()" class="text-sm text-emerald-400 hover:text-emerald-300" data-zh="下載 PDF" data-en="Download PDF"></button></div><div class="h-80"><canvas id="balance-chart"></canvas></div></div><div class="md:col-span-2 tool-card rounded-3xl p-8"><div class="font-semibold mb-4" data-zh="債務分佈" data-en="Debt Distribution"></div><div class="h-80"><canvas id="debt-pie-chart"></canvas></div></div></div>
<div class="mt-8 p-6 bg-[#0f172a] rounded-2xl border border-white/10"><div class="font-semibold mb-2" data-zh="計算假設説明" data-en="Calculation Assumptions"></div><div class="text-sm text-slate-400" data-zh="此計算器假設每月固定還款，不考慮利率調整或新增開支。實際結果可能有差異。" data-en="This calculator assumes fixed monthly payments. Actual results may vary."></div></div></div></div>

<!-- Expanded Financial Freedom Education Section -->
<section class="max-w-6xl mx-auto px-6 pb-20">
  <div class="text-center mb-12">
    <div class="text-emerald-400 text-sm font-semibold tracking-widest mb-2" data-zh="起踊財務自由" data-en="BUILD YOUR FINANCIAL FUTURE"></div>
    <h2 class="text-4xl font-semibold mb-3" data-zh="清零債務後，為財務自由打好基礎" data-en="After Clearing Debt, Build Your Foundation for Financial Freedom"></h2>
    <p class="text-slate-400 max-w-2xl mx-auto" data-zh="債務清零不係結束，而係新生活的開始。以下是香港人實用的財務管理心得。" data-en="Clearing debt is not the end — it's the beginning. Here are practical tips tailored for Hong Kong people."></p>
  </div>

  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Card 1 -->
    <div class="tool-card rounded-3xl p-8 border border-white/10">
      <div class="text-emerald-400 text-sm font-semibold mb-3" data-zh="基礎" data-en="FOUNDATION"></div>
      <h3 class="text-xl font-semibold mb-3" data-zh="建立 3-6 個月紧急基金" data-en="Build 3-6 Months Emergency Fund"></h3>
      <p class="text-slate-400 text-sm leading-relaxed" data-zh="清零債務後，最重要的事情就係先留足紧急基金，防止因意外事件再次回到負債。" data-en="After clearing debt, prioritize building an emergency fund covering 3-6 months of expenses to avoid falling back into debt."></p>
    </div>

    <!-- Card 2 -->
    <div class="tool-card rounded-3xl p-8 border border-white/10">
      <div class="text-emerald-400 text-sm font-semibold mb-3" data-zh="心態" data-en="MINDSET"></div>
      <h3 class="text-xl font-semibold mb-3" data-zh="避免生活方式膨脆" data-en="Avoid Lifestyle Inflation"></h3>
      <p class="text-slate-400 text-sm leading-relaxed" data-zh="清零債務後，小心不要因為收入增加而增加開支。繼續保持簡單的生活樣式是長遠財務自由的關鍵。" data-en="After becoming debt-free, resist the urge to increase spending as income rises. Maintaining a simple lifestyle is key to long-term financial freedom."></p>
    </div>

    <!-- Card 3 -->
    <div class="tool-card rounded-3xl p-8 border border-white/10">
      <div class="text-emerald-400 text-sm font-semibold mb-3" data-zh="投資" data-en="INVESTING"></div>
      <h3 class="text-xl font-semibold mb-3" data-zh="從小額投資開始" data-en="Start Small with Investing"></h3>
      <p class="text-slate-400 text-sm leading-relaxed" data-zh="可以從每月定投指數基金開始，利用复利效應讓資產随時間增長。不要等到有大筆錢先開始。" data-en="Start investing small every month through index funds. Use the power of compounding instead of waiting for a large sum."></p>
    </div>

    <!-- Card 4 -->
    <div class="tool-card rounded-3xl p-8 border border-white/10">
      <div class="text-emerald-400 text-sm font-semibold mb-3" data-zh="收入" data-en="INCOME"></div>
      <h3 class="text-xl font-semibold mb-3" data-zh="建立多元收入來源" data-en="Build Multiple Income Streams"></h3>
      <p class="text-slate-400 text-sm leading-relaxed" data-zh="除了主職，可以考慮副業、租資、投資收入等。多元收入能大大降低風險。" data-en="Besides your main job, consider side hustles, rental income, or investment returns. Multiple income streams greatly reduce financial risk."></p>
    </div>

    <!-- Card 5 -->
    <div class="tool-card rounded-3xl p-8 border border-white/10">
      <div class="text-emerald-400 text-sm font-semibold mb-3" data-zh="習慫" data-en="HABITS"></div>
      <h3 class="text-xl font-semibold mb-3" data-zh="養成記帳同每月審查" data-en="Track Spending & Review Monthly"></h3>
      <p class="text-slate-400 text-sm leading-relaxed" data-zh="每月定時審查開支同投資結果，可以幫到你持續改善財務狀況。" data-en="Review your spending and investment results every month. This habit helps you continuously improve your financial situation."></p>
    </div>

    <!-- Card 6 -->
    <div class="tool-card rounded-3xl p-8 border border-white/10">
      <div class="text-emerald-400 text-sm font-semibold mb-3" data-zh="長期" data-en="LONG-TERM"></div>
      <h3 class="text-xl font-semibold mb-3" data-zh="設定財務自由目標" data-en="Set Clear Financial Freedom Goals"></h3>
      <p class="text-slate-400 text-sm leading-relaxed" data-zh="明確自己想達到的財務自由目標（例如幾歲退休、每月被動收入達到幾多），會讓你的行動更有方向。" data-en="Define what financial freedom means to you (e.g. retirement age or passive income target). Clear goals make your actions more focused."></p>
    </div>
  </div>
</section>

<footer class="bg-[#0a0f1a] border-t border-white/10 py-10"><div class="max-w-6xl mx-auto px-6 grid md:grid-cols-4 gap-y-8 text-sm"><div><div class="font-semibold mb-3">DebtZero Pro</div><div class="text-slate-400 text-xs" data-zh="專為香港人設計的債務清零工具" data-en="Debt payoff tool designed for Hong Kong"></div></div><div class="space-y-1.5"><a href="about.html" class="block text-slate-400 hover:text-white transition" data-zh="About" data-en="About"></a><a href="disclaimer.html" class="block text-slate-400 hover:text-white transition" data-zh="Disclaimer" data-en="Disclaimer"></a></div><div class="space-y-1.5"><a href="privacy.html" class="block text-slate-400 hover:text-white transition" data-zh="Privacy Policy" data-en="Privacy Policy"></a><a href="terms.html" class="block text-slate-400 hover:text-white transition" data-zh="Terms" data-en="Terms"></a></div><div class="text-slate-400 text-xs">© 2026 DebtZero Pro</div></div></footer>

</body>
</html>
